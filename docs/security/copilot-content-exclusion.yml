# NOTE https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot#configuring-content-exclusion-for-your-repository
# ===================================
# Copilot does NOT read a repo file for exclusions. Content exclusion is a
# GitHub *settings* feature configured by repo/org/enterprise admins:
#
#   Org-wide (recommended): Organization → Settings → Copilot → Content exclusion
#   Per-repo:               Repository  → Settings → Copilot → Content exclusion
#
#
# ⚠️  IMPORTANT LIMITATIONS (per GitHub docs):
#   • Copilot CLI, the Copilot coding agent, and Agent mode in Copilot Chat in
#     IDEs do NOT honor content exclusion. Do not rely on it for those surfaces.
#   • Exclusion can take a short time to propagate after saving.
#
# "*" means "any repository / anywhere on the filesystem".

# The block below is generated from .github/scripts/secret-patterns.txt by
# sync-ignores.mjs. To change it, edit that file and run the script.
"*":
  # === BEGIN SECURITY FLOOR (generated by sync-ignores.mjs — do not edit) ===
  - "**/.env"
  - "**/.env.*"
  - "!**/.env.example"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.p12"
  - "**/*.pfx"
  - "**/*.keystore"
  - "**/id_rsa*"
  - "**/id_ed25519*"
  - "**/*.cert"
  - "**/secrets/**"
  - "**/secrets.*"
  - "**/credentials.json"
  - "**/service-account*.json"
  - "**/gha-creds-*.json"
  - "**/application_default_credentials.json"
  - "**/.npmrc.local"
  # === END SECURITY FLOOR ===
